name: Bug Report
description: File a bug or unexpected behavior report
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue with CampusSpace!
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Brief one-line description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What steps reproduce the problem?
      placeholder: |
        1. Open #/availability
        2. Click on Room 301
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
